<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signing you in…</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 80px auto; text-align: center; color: #333; }
        .token-box { background: #eef2ff; padding: 10px; border-radius: 6px; font-size: 0.75rem; word-break: break-all; margin-top: 16px; }
        a { color: #1d4ed8; }
    </style>
</head>
<body>
<h2>Signed in with Google</h2>
<p id="status">Reading token…</p>
<div id="token-box" class="token-box" style="display:none;"></div>
<p><a href="/">← Back to auth tester</a></p>

<script>
    // The success handler redirects here as: /oauth2-success.html?token=...&userId=...&name=...&role=...
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const user = {
        userId: Number(params.get('userId')),
        name: params.get('name'),
        role: params.get('role')
    };

    if (token) {
        sessionStorage.setItem('bts_token', token);
        sessionStorage.setItem('bts_user', JSON.stringify(user));
        document.getElementById('status').textContent = `Logged in as ${user.name} (${user.role}).`;
        const box = document.getElementById('token-box');
        box.style.display = 'block';
        box.textContent = token;
    } else {
        document.getElementById('status').textContent = 'No token received — something went wrong.';
    }
</script>
</body>
</html>
